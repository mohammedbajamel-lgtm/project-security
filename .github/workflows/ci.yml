name: CloudSec AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        run: ruff check lambda/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov boto3 botocore moto jinja2 requests jsonschema

      - name: Run unit tests
        run: |
          # NOTE (T01-01 → T02+): This stage is non-blocking at T01-01 because
          # no application code or tests exist yet (structural skeleton only).
          # Once testable Lambda code exists (Phase 2+), remove the `|| true`
          # and uncomment the coverage gate below to enforce the 90% minimum.
          pytest tests/unit --cov=lambda --cov-report=term-missing -v || true

          # # Long-term gate — enable when tests exist:
          # pytest tests/unit --cov=lambda --cov-report=term-missing --cov-fail-under=90

  tfsec:
    name: tfsec (Infrastructure Security Scan)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          working_directory: terraform
          severity: CRITICAL,HIGH
          output_format: sarif
          output_file: tfsec.sarif
          fail_on_critical: true

      - name: Upload tfsec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-results
          path: terraform/tfsec.sarif
