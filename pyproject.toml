[project]
name = "cloudsec-ai"
version = "0.1.0"
description = "AWS-native automated incident response platform"
readme = "docs/development.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CloudSec Platform Team" }]

dependencies = [
  "boto3>=1.34.0,<2.0",
  "botocore>=1.34.0,<2.0",
  "jinja2>=3.1.0,<4.0",
  "requests>=2.31.0,<3.0",
  "pydantic>=2.5.0,<3.0",
  "jsonschema>=4.21.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0",
  "pytest-cov>=5.0.0,<6.0",
  "pytest-mock>=3.12.0,<4.0",
  "moto[s3,sqs,sns,lambda,dynamodb,kms,iam,cloudtrail,events,ssm]>=5.0.0,<6.0",
  "freezegun>=1.5.0,<2.0",
  "black>=24.1.0,<25.0",
  "ruff>=0.4.0,<0.5.0",
  "mypy>=1.9.0,<2.0",
]
security = [
  "bandit>=1.7.5,<2.0",
  "safety>=3.0.0,<4.0",
]
local = [
  "localstack>=3.0.0,<4.0",
  "docker>=7.0.0,<8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=lambda",
  "--cov-report=term-missing",
  "--cov-report=html:reports/coverage",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "unit: fast unit tests (no network, no AWS)",
  "integration: tests that use moto/localstack (may need subprocess)",
  "e2e: end-to-end tests requiring a real AWS environment",
  "e2e_live: lab-only tests that can call AWS when explicitly enabled",
  "slow: tests that take more than 10 seconds",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", "__pycache__", "build", "dist", "reports"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit (baseline security)
  "N",   # pep8-naming
  "RUF", # ruff-specific
]
ignore = [
  "S101", # use of assert is fine in tests
  "B008", # function call in default argument (boto3 client patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"lambda/**" = ["S311"] # security libs are the point of these modules

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["lambda"]
branch = true
omit = [
  "lambda/*/lambda_function.py", # deployment entrypoints (tested via integration)
]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 70

[tool.setuptools.packages.find]
where = ["."]
include = ["lambda*"]
exclude = ["tests*", "reports*"]
