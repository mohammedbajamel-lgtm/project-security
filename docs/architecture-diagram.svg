<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .title{font:700 34px 'Segoe UI',Arial;fill:#161e2d}.subtitle{font:16px 'Segoe UI',Arial;fill:#5f6b7a}
      .boundary{fill:#fff;stroke:#879196;stroke-width:3;rx:14}.account{font:700 19px 'Segoe UI',Arial;fill:#232f3e}
      .stage{fill:#f7f8fa;stroke:#aab1b7;stroke-width:1.5;rx:10}.label{font:600 14px 'Segoe UI',Arial;fill:#232f3e;text-anchor:middle}.small{font:12px 'Segoe UI',Arial;fill:#53606d;text-anchor:middle}
      .flow{fill:none;stroke:#4b5563;stroke-width:3;marker-end:url(#arrow)}.advisory{fill:none;stroke:#d13212;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#redarrow)}
      .kms{fill:#fff7ed;stroke:#ff9900;stroke-width:2;rx:10}.note{font:600 13px 'Segoe UI',Arial;fill:#8b2c0c;text-anchor:middle}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d13212"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#f5f7f9"/>
  <text x="55" y="55" class="title">CloudSec AI — AWS Security Incident Response Architecture</text>
  <text x="55" y="84" class="subtitle">Telemetry → correlation → evidence-backed AI investigation → deterministic safety → approved remediation → independent verification</text>

  <rect x="45" y="120" width="360" height="435" class="boundary" fill="#eef7ff"/><text x="65" y="153" class="account">AWS Workload Account(s)</text>
  <text x="65" y="178" class="subtitle">Telemetry sources • cross-account write only</text>
  <g transform="translate(75 215)"><image href="architecture/icons/Arch_Amazon-GuardDuty_64.svg" width="64" height="64"/><text x="32" y="86" class="label">GuardDuty</text></g>
  <g transform="translate(190 215)"><image href="architecture/icons/Arch_AWS-Security-Hub_64.svg" width="64" height="64"/><text x="32" y="86" class="label">Security Hub</text></g>
  <g transform="translate(305 215)"><image href="architecture/icons/Arch_AWS-CloudTrail_64.svg" width="64" height="64"/><text x="32" y="86" class="label">CloudTrail</text></g>
  <g transform="translate(130 355)"><image href="architecture/icons/Arch_AWS-Config_64.svg" width="64" height="64"/><text x="32" y="86" class="label">AWS Config</text></g>
  <g transform="translate(255 355)"><image href="architecture/icons/Arch_Amazon-CloudWatch_64.svg" width="64" height="64"/><text x="32" y="86" class="label">VPC Flow Logs</text></g>

  <rect x="45" y="610" width="360" height="390" class="boundary" fill="#fff8e6"/><text x="65" y="643" class="account">Isolated AWS Lab / Demo Account</text>
  <text x="65" y="668" class="subtitle">Disposable targets • synthetic evidence only</text>
  <rect x="80" y="710" width="290" height="205" class="stage"/>
  <text x="225" y="745" class="label">cloudsec-lab-* / cloudsec-demo-*</text>
  <text x="225" y="780" class="small">IAM key • S3 bucket • security group</text>
  <text x="225" y="805" class="small">CloudTrail fixtures • controlled simulations</text>
  <text x="225" y="850" class="note">No production resources or telemetry</text>
  <text x="225" y="880" class="small">Account verification + explicit live confirmation</text>

  <rect x="455" y="120" width="1415" height="880" class="boundary"/><text x="480" y="153" class="account">AWS Security Account — CloudSec AI control plane</text>
  <rect x="490" y="185" width="230" height="145" class="stage"/>
  <image href="architecture/icons/Arch_Amazon-EventBridge_64.svg" x="573" y="205" width="64" height="64"/><text x="605" y="291" class="label">Amazon EventBridge</text><text x="605" y="313" class="small">Custom security bus</text>
  <rect x="750" y="185" width="225" height="145" class="stage"/>
  <image href="architecture/icons/Arch_AWS-Lambda_64.svg" x="830" y="205" width="64" height="64"/><text x="862" y="291" class="label">AWS Lambda</text><text x="862" y="313" class="small">Normalize + correlate</text>
  <rect x="1005" y="185" width="225" height="145" class="stage"/>
  <image href="architecture/icons/Arch_Amazon-DynamoDB_64.svg" x="1085" y="205" width="64" height="64"/><text x="1117" y="291" class="label">Amazon DynamoDB</text><text x="1117" y="313" class="small">Findings + incidents</text>
  <rect x="1260" y="185" width="230" height="145" class="stage"/>
  <image href="architecture/icons/Arch_AWS-Lambda_64.svg" x="1343" y="205" width="64" height="64"/><text x="1375" y="291" class="label">Investigation Lambdas</text><text x="1375" y="313" class="small">Evidence • timeline • blast radius</text>
  <rect x="1520" y="185" width="310" height="145" class="stage"/>
  <image href="architecture/icons/Arch_Amazon-Bedrock_64.svg" x="1643" y="202" width="64" height="64"/><text x="1675" y="288" class="label">Amazon Bedrock</text><text x="1675" y="310" class="note">Recommendations only — no AWS execution role</text>

  <rect x="590" y="410" width="360" height="150" class="stage"/>
  <image href="architecture/icons/Arch_AWS-Lambda_64.svg" x="738" y="430" width="64" height="64"/><text x="770" y="516" class="label">Deterministic Safety Validation</text><text x="770" y="539" class="small">Schema • citations • evidence • policy • risk</text>
  <rect x="1000" y="410" width="315" height="150" class="stage"/>
  <image href="architecture/icons/Arch_Amazon-API-Gateway_64.svg" x="1065" y="430" width="64" height="64"/><image href="architecture/icons/Arch_Amazon-Cognito_64.svg" x="1185" y="430" width="64" height="64"/><text x="1157" y="516" class="label">Human Approval (Level 2)</text><text x="1157" y="539" class="small">API Gateway + Amazon Cognito</text>
  <rect x="1365" y="410" width="330" height="150" class="stage"/>
  <image href="architecture/icons/Arch_AWS-Step-Functions_64.svg" x="1498" y="430" width="64" height="64"/><text x="1530" y="516" class="label">AWS Step Functions</text><text x="1530" y="539" class="small">Allow-listed playbooks • rollback • audit</text>

  <rect x="545" y="650" width="285" height="150" class="stage"/>
  <image href="architecture/icons/Arch_AWS-Lambda_64.svg" x="655" y="670" width="64" height="64"/><text x="687" y="756" class="label">Independent Verification</text><text x="687" y="779" class="small">Re-query → resolve or escalate</text>
  <rect x="875" y="630" width="440" height="190" class="kms"/>
  <image href="architecture/icons/Arch_Amazon-Simple-Storage-Service_64.svg" x="950" y="665" width="64" height="64"/><image href="architecture/icons/Arch_AWS-Key-Management-Service_64.svg" x="1170" y="665" width="64" height="64"/><text x="1095" y="760" class="label">Evidence boundary: Amazon S3 + AWS KMS</text><text x="1095" y="784" class="small">Versioning/Object Lock • manifests • snapshots • reports</text>
  <rect x="1360" y="650" width="310" height="150" class="stage"/>
  <image href="architecture/icons/Arch_Amazon-CloudWatch_64.svg" x="1430" y="670" width="64" height="64"/><image href="architecture/icons/Arch_Amazon-Simple-Notification-Service_64.svg" x="1540" y="670" width="64" height="64"/><text x="1515" y="756" class="label">Observability + Notifications</text><text x="1515" y="779" class="small">CloudWatch • SNS • encrypted SQS DLQ</text>
  <rect x="740" y="875" width="830" height="70" class="kms"/><image href="architecture/icons/Arch_AWS-Key-Management-Service_64.svg" x="765" y="878" width="54" height="54"/><text x="1190" y="908" class="label">Separate customer-managed KMS keys: findings • incidents • evidence • SSM</text><text x="1190" y="930" class="small">Scoped key policies, rotation, encryption at rest</text>

  <path d="M405 305 H490" class="flow"/><text x="445" y="292" class="small">findings</text>
  <path d="M405 795 C450 795 450 320 490 320" class="flow"/>
  <path d="M720 257 H750" class="flow"/><path d="M975 257 H1005" class="flow"/><path d="M1230 257 H1260" class="flow"/>
  <path d="M1490 257 H1520" class="advisory"/><path d="M1520 305 C1420 365 1050 365 930 430" class="advisory"/>
  <path d="M1375 330 C1260 370 930 365 840 410" class="flow"/>
  <path d="M950 485 H1000" class="flow"/><path d="M950 520 C1120 590 1280 590 1365 520" class="flow"/>
  <path d="M1315 485 H1365" class="flow"/><path d="M1530 560 C1470 610 860 600 760 650" class="flow"/>
  <path d="M830 725 H875" class="flow"/><path d="M1315 725 H1360" class="flow"/>
  <text x="1635" y="365" class="note">Dashed red = untrusted advisory response</text>
  <text x="500" y="975" class="subtitle">Solid arrows = data/control flow • Every execution role is least-privilege • Level 3 is rejected/escalated • Verification is independent</text>
</svg>
